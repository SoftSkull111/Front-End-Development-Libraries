<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="main-container grid grid-cols-3 gap-2 bg-blue-100">
      <div class="card border-2 border-black rounded-md p-4">
        <h2 class="subheading text-center mb-4 text-xl flex-wrap truncate font-bold">
          Colosseo
        </h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="colosseo" class="rounded-md">
        <p class="description text-sm font-semibold">
          A very nice colosseo
        </p>
      </div>
      <div class="card border-2 border-black rounded-md p-4">
        <h2 class="subheading text-center mb-4 text-xl flex-wrap truncate font-bold">
          Alps
        </h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="alps" class="rounded-md">
        <p class="description text-sm font-semibold">
          A very nice alps
        </p>
      </div>
      <div class="card border-2 border-black rounded-md p-4">
        <h2 class="subheading text-center mb-4 text-xl flex-wrap truncate font-bold">
          Sea
        </h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="sea" class="rounded-md">
        <p class="description text-sm font-semibold">
          A very nice sea
        </p>
      </div>
    </div>
  </body>
</html>
